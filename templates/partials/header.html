{% load static %}
<header class="site-header">
  <div class="container site-header__inner">
    <a class="logo" href="/" aria-label="Bestory ana sayfa">
      <img src="{% static 'img/logo.svg' %}" alt="" width="28" height="28">
      <span>Bestory</span>
    </a>
    <div class="header-actions">
      {% if show_country_select %}
      <div class="select-wrap">
        <label class="sr-only" for="country-select">Ülke</label>
        <select class="select" id="country-select" name="country" form="search-form">
          {% for c in countries %}
            <option value="{{ c.code }}"{% if c.code == default_country %} selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Tema: otomatik. Değiştirmek için tıkla">
        <svg class="theme-icon theme-icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-icon theme-icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-icon theme-icon--system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <nav class="auth-nav" aria-label="Hesap">
        {% if user.is_authenticated %}
          <details class="user-menu">
            <summary class="btn btn-secondary btn-sm"><span class="sr-only">Hesap menüsü: </span>{{ user.username }}</summary>
            <div class="user-menu__panel">
              <a href="{% url 'accounts:profile' %}">Profil</a>
              <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="user-menu__item">Çıkış yap</button>
              </form>
            </div>
          </details>
        {% else %}
          <a class="btn btn-secondary btn-sm" href="{% url 'accounts:login' %}{% if login_next %}?next={{ login_next|urlencode }}{% endif %}">Giriş yap</a>
          <a class="btn btn-primary btn-sm auth-nav__register" href="{% url 'accounts:register' %}{% if login_next %}?next={{ login_next|urlencode }}{% endif %}">Kayıt ol</a>
        {% endif %}
      </nav>
    </div>
  </div>
</header>
